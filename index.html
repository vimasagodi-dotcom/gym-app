<!doctype html>
<html lang="pt" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Otimizações Especiais para Android & iOS Viewport / Notch / Dynamic Island -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />

    <!-- iOS Safari PWA Standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IRON ATLAS" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Android Chrome PWA -->
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="description" content="A aplicação de treino de ginásio e musculação mais completa: base anatómica V-Taper, sobrecarga progressiva, temporizador e análise muscular." />
    <title>IRON ATLAS — Treino & Hipertrofia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Registo do Service Worker para suporte Offline no ginásio -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('PWA Service Worker registado com sucesso:', reg.scope))
            .catch((err) => console.warn('Registo do Service Worker ignorado em dev:', err));
        });
      }
    </script>
  </body>
</html>
